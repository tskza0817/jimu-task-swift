<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>メンテナンス中 | JIMU Task Swift</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: "Noto Sans JP", system-ui, sans-serif;
      color: #e2e8f0;
      background: radial-gradient(circle at 20% 20%, #1e3a8a 0%, transparent 50%),
                  radial-gradient(circle at 80% 80%, #0e7490 0%, transparent 45%),
                  #0f172a;
      overflow: hidden;
    }
    .card {
      max-width: 560px;
      width: 100%;
      text-align: center;
      padding: 56px 32px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.4);
    }
    .icon {
      width: 72px; height: 72px; margin: 0 auto 28px;
      border-radius: 20px;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #3b82f6, #06b6d4);
      animation: pulse 2.4s ease-in-out infinite;
    }
    .icon svg { width: 36px; height: 36px; color: #fff; animation: spin 6s linear infinite; }
    h1 { font-size: clamp(1.4rem, 5vw, 1.9rem); font-weight: 900; line-height: 1.5; color: #fff; }
    p { margin-top: 16px; font-size: 1rem; color: #94a3b8; line-height: 1.8; }
    .bar { margin: 32px auto 0; width: 160px; height: 4px; border-radius: 4px; background: rgba(255,255,255,0.12); overflow: hidden; }
    .bar::after { content: ""; display: block; width: 40%; height: 100%; border-radius: 4px; background: linear-gradient(90deg, #3b82f6, #06b6d4); animation: slide 1.6s ease-in-out infinite; }
    .brand { margin-top: 32px; font-size: 0.75rem; letter-spacing: 0.2em; color: #64748b; font-weight: 700; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(59,130,246,.5); } 50% { box-shadow: 0 0 0 18px rgba(59,130,246,0); } }
    @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
</head>
<body>
  <main class="card">
    <div class="icon" aria-hidden="true">
      <svg fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
        <path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.4-.6-.6-2.4z"/>
      </svg>
    </div>
    <h1>只今メンテナンス中です。</h1>
    <p>順次サービスを開始いたします。<br>ご不便をおかけしますが、今しばらくお待ちください。</p>
    <div class="bar" role="presentation"></div>
    <div class="brand">JIMU TASK SWIFT</div>
  </main>
</body>
</html>
